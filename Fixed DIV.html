<!DOCTYPE html>
<html>
<head>
<title>Fixed DIV</title>
<style>
div.fijo {
    position: fixed;
    bottom: 0;
    right: 0;
    width: 400px;
    border: 3px solid blue;
}
</style>
</head>
<body>
<h2>Posición del DIV: fixed;</h2>
<p>Un elemento con posición Fija se ubica de manera relativa a la vista del navegador (viewport), lo que significa que siempre permanece en el mismo lugar, aunque se mueva la página (scroll)</p>
<div class="fijo">
<p>Este elemento DIV tiene asignada la posición: <b><i>fixed; </i></b></p>
</div>
</body>
</html>
