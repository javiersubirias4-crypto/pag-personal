<!DOCTYPE html>
<html>
<head>
<title>Relative DIV</title>
<link rel="icon" href="smiley.png" type="image/x-icon">
<style>
div.relativo {
    position: relative;
    left: 30px;
    border: 5px solid red;
}
</style>
</head>
<body>
<h2>Posición del DIV: relative;</h2>
<p>Un elemento con posición Relativa se puede ubicar de manera relativa a su posición original, y se puede modificar su ubicación desde CSS</p>
<div class="relativo">
<p>Este elemento DIV tiene asignada la posición: <b><i>relative; </i></b></p>
</div>
</body>
</html>
